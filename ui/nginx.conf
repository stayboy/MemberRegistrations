# Local Compose stack. The officer app is served from `/` (hash routing), and
# the public member acceptance page at `/v` from the built `v.html` (MR-51).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /v {
    try_files /v.html =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
