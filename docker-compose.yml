name: member-registrations

x-api-image: &api-image
  image: member-registrations-api:local
  build:
    context: .
    target: api
    args:
      GIT_SHA: ${GIT_SHA:-dev}

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: member_registrations
    volumes:
      # Postgres 18 keeps PGDATA under /var/lib/postgresql/<major>/docker, so the
      # image declares the volume at the parent. The old `/data` path is not
      # persisted on 18.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d member_registrations']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *api-image
    command: ['node', 'dist/db/migrate-cli.js']
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/member_registrations
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    <<: *api-image
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/member_registrations
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      UI_BASE_URL: 'http://localhost:8080/#/connect'
      # The API gate is on locally, as it is in production: without it `/v1` answers 200 to
      # anyone and the release cannot prove a 401. A local value, not a secret -- the gateway
      # injects it for the browser, exactly as it does in production.
      API_BEARER_TOKEN: local-development-bearer-change-me
      # Local MVP: every screen must be exercisable, so the switched-off
      # subsystems are on here. Development only — production keeps both off.
      USSD_ENABLED: 'true'
      PAYMENTS_ENABLED: 'true'
      # Explicit local secrets, as for the bearer: the stack must not drift onto a
      # library default, and the smoke signs with the same values the app verifies with.
      USSD_GATEWAY_SECRET: local-development-ussd-gateway-secret
      PAYMENT_GATEWAY_SECRET: local-development-payment-secret
      # The public member acceptance page is served by the Compose UI on 8080;
      # the SMS appends #t=<token> to this base (MR-51).
      VERIFICATION_LINK_BASE: http://localhost:8080/v
      LOG_LEVEL: info
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The long-lived queue worker (notification spec N-8, FR-20, FR-42). Same image,
  # no port: it polls the `pgboss` schema continuously, which is what the local
  # stack buys (a containerised Postgres has no per-hour meter). The image's HTTP
  # healthcheck would fail a process that never listens, so it is disabled here.
  worker:
    <<: *api-image
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/member_registrations
      LOG_LEVEL: info
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The pg-boss dashboard is a local operations monitor (spec FR-43): on demand
  # only (`docker compose --profile tools up`), behind basic auth, bound to the
  # host loopback, read-only, never deployed and never linked from the officer UI.
  # A requeue goes through the audited API retry, not through this screen.
  pgboss-ui:
    image: node:24.22.3-alpine
    profiles: ['tools']
    command: ['npx', '-y', '@pg-boss/dashboard@1.14.0']
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/member_registrations
      PGBOSS_SCHEMA: pgboss
      PORT: '3000'
      # Local basic auth. Not secrets: the defaults exist so the profile starts
      # without extra setup, and the shell can override either value.
      PGBOSS_DASHBOARD_AUTH_USERNAME: ${PGBOSS_DASHBOARD_AUTH_USERNAME:-local}
      PGBOSS_DASHBOARD_AUTH_PASSWORD: ${PGBOSS_DASHBOARD_AUTH_PASSWORD:-local-dashboard-password-change-me}
      # The vendor documents `1`; `true` is not the accepted form. With it set, the
      # server rejects every non-GET/HEAD request with 403, so no action can be
      # crafted by hand either (FR-43: the dashboard stays a monitor).
      PGBOSS_DASHBOARD_READ_ONLY: '1'
    depends_on:
      db:
        condition: service_healthy

  ui:
    image: member-registrations-ui:local
    build:
      context: .
      target: ui
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        VITE_USSD_CONSOLE: 'true'
    ports:
      - '8080:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      - app

volumes:
  db-data:
