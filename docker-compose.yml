name: member-registrations

x-api-image: &api-image
  image: member-registrations-api:local
  build:
    context: .
    target: api

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: member_registrations
    volumes:
      # Postgres 18 keeps PGDATA under /var/lib/postgresql/<major>/docker, so the
      # image declares the volume at the parent. The old `/data` path is not
      # persisted on 18.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d member_registrations']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *api-image
    command: ['node', 'dist/db/migrate-cli.js']
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/member_registrations
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    <<: *api-image
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/member_registrations
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      UI_BASE_URL: 'http://localhost:8080/#/connect'
      # Local MVP: every screen must be exercisable, so the switched-off
      # subsystems are on here. Development only — production keeps both off.
      USSD_ENABLED: 'true'
      PAYMENTS_ENABLED: 'true'
      LOG_LEVEL: info
    depends_on:
      migrate:
        condition: service_completed_successfully

  ui:
    image: member-registrations-ui:local
    build:
      context: .
      target: ui
    ports:
      - '8080:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      - app

volumes:
  db-data:
