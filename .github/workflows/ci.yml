name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          # check-round diffs the branch against main, which needs a merge base.
          fetch-depth: 0

      # Round docs are part of the change. Fetch the base ref in full when the
      # checkout did not bring it; the script itself reports any missing field.
      - name: Check round docs
        run: |
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            git fetch --no-tags origin main:refs/remotes/origin/main
          fi
          node scripts/check-round.mjs

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run verify
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  # The UI is a workspace with its own ESLint/tsconfig/Vitest, and the root
  # `verify` job deliberately excludes `ui/**`; without this job a UI change
  # could be green while none of its tests or its build ever ran.
  ui:
    name: ui
    runs-on: ubuntu-latest
    # A production build fails without the baked origin (AC-10b), and CI builds
    # the same artefact the Pages workflow deploys.
    env:
      VITE_GATEWAY_URL: https://member-registrations-mind-logs.vercel.app

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run ui:lint
      - run: npm run ui:typecheck
      - run: npm run ui:test
      - run: npm run ui:build

  # The browser harness runs the production build against stubbed gateway routes.
  # It needs no database and no secrets: the session is seeded in sessionStorage.
  ui-e2e:
    name: ui-e2e
    runs-on: ubuntu-latest
    # The harness builds the production bundle; its Playwright config also sets
    # this, and the job-level value keeps both paths identical.
    env:
      VITE_GATEWAY_URL: https://member-registrations-mind-logs.vercel.app

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ui:e2e
